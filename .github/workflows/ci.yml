name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime deps for the pure-logic tests
        # The smoke tests import card_renderer/themer/cc_frames/card_video (no Ollama/ComfyUI).
        # numpy backs card_video's procedural foil sweep, exercised by test_foil_and_formats.
        run: python -m pip install --upgrade pip pillow requests pixie-python numpy

      - name: Syntax-check all tracked Python
        run: python -m py_compile $(git ls-files '*.py')

      - name: Smoke tests
        run: python tests/test_smoke.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install + build frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
