name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install from the real manifest
        # Installing an ad-hoc list here is what hid `numpy` missing from
        # requirements.txt: CI passed while a clean `pip install -r requirements.txt`
        # produced an app that ImportErrors on card_video's foil path. Install what we
        # actually ship, so the manifest is under test too.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Syntax-check all tracked Python
        run: python -m py_compile $(git ls-files '*.py')

      - name: Tests
        # `pytest tests`, NOT `python tests/test_smoke.py`. The old command ran only the
        # smoke file, so the ~500 engine tests under tests/engine/ — the entire simulation,
        # semantics and ratings suite — never ran in CI at all. conftest.py is what makes
        # test_smoke.py's checks assert under pytest (see CLAUDE.md), so this entry point
        # is strictly stronger than the old one, not merely different.
        #
        # ccm/compiled/ is gitignored, so the engine runs at rung-1 here. Verified the
        # whole suite passes with no store and no data dir, which is exactly CI's state.
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install + build frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
