[pytest]
# Collect ONLY the real suite. The repo root also holds several ad-hoc scripts named
# test_*.py (test_gen.py, test_render.py, test_ro_inject.py, utilities/test_cuda_inference.py)
# which are manual generation/render probes, not pytest tests. They execute work at import
# and one of them calls sys.exit(1), which crashed a bare `pytest` run with INTERNALERROR
# rather than a normal failure — and that is exactly what the nightly report's sanity check
# ran, so it reported rc=3 every night.
testpaths = tests

# Belt and braces: even if someone points pytest at the repo root explicitly, don't wander
# into the scripts, the built frontend, or the engine's data directories.
norecursedirs = utilities frontend node_modules renders generated_art cache data ccm corpus .git
